<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Navigation Switcher</h1>
  <p class="intro">Friends send links from the other maps app? Pick where you want them to open and they are converted automatically in Safari.</p>
  <div class="choices" role="radiogroup">
    <button class="choice" data-app="apple" role="radio">
      <span class="emoji">🍎</span><span>Apple Maps</span>
    </button>
    <button class="choice" data-app="google" role="radio">
      <span class="emoji">🗺️</span><span>Google Maps</span>
    </button>
    <button class="choice" data-app="off" role="radio">
      <span class="emoji">⏸️</span><span>Off</span>
    </button>
  </div>
  <p class="hint" id="hint"></p>
  <div class="counter">
    <div class="count" id="count">0</div>
    <div class="label">links converted</div>
    <div class="fun" id="fun"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
